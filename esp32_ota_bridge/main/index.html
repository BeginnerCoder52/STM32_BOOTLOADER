<!DOCTYPE html>
<html>
<head>
    <title>STM32 OTA Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #16213e; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #0f3460; }
        h2 { color: #4ecca3; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .file-input-label { background: #0f3460; border: 2px dashed #4ecca3; padding: 20px; display: block; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .file-input-label:hover { background: #1a1a2e; border-color: #45b293; }
        input[type="file"] { display: none; }
        .btn { background: #4ecca3; color: #1a1a2e; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; font-size: 1rem; }
        .btn:hover { background: #45b293; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(78,204,163,0.3); }
        .btn:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
        .progress-container { margin-top: 25px; display: none; }
        .progress-bar { background: #0f3460; border-radius: 10px; height: 10px; overflow: hidden; }
        .progress-fill { background: #4ecca3; width: 0%; height: 100%; transition: 0.4s; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>FIRMWARE OTA</h2>
        <label class="file-input-label" id="drop-area">
            <span id="file-name">Select .bin file</span>
            <input type="file" id="file-input" accept=".bin">
        </label>
        <button class="btn" id="upload-btn" onclick="uploadFile()">START UPDATE</button>
        
        <div class="progress-container" id="prg-cont">
            <div class="progress-bar"><div class="progress-fill" id="prg-fill"></div></div>
            <div id="status">Ready to flash...</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        fileInput.onchange = () => {
            document.getElementById('file-name').innerText = fileInput.files[0].name;
        };

        function uploadFile() {
            var file = fileInput.files[0];
            if (!file) return alert("Please select a file!");

            var xhr = new XMLHttpRequest();
            
            // Xóa đoạn FormData cũ
            // var fd = new FormData();
            // fd.append("file", file);

            document.getElementById('prg-cont').style.display = 'block';
            document.getElementById('upload-btn').disabled = true;

            xhr.upload.addEventListener("progress", (e) => {
                var percent = (e.loaded / e.total) * 100;
                document.getElementById('prg-fill').style.width = percent + "%";
                document.getElementById('status').innerText = "Uploading to ESP32: " + Math.round(percent) + "%";
            });

            xhr.onreadystatechange = () => {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        document.getElementById('status').innerText = "Success! STM32 is rebooting.";
                        document.getElementById('status').style.color = "#4ecca3";
                    } else {
                        document.getElementById('status').innerText = "Error: Flash failed.";
                        document.getElementById('status').style.color = "#ff4d4d";
                        document.getElementById('upload-btn').disabled = false;
                    }
                }
            };

            xhr.open("POST", "/upload", true);
            // Gửi trực tiếp file (Raw Binary)
            xhr.send(file);
        }
    </script>
</body>
</html>
